name: agr-lakehouse

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL: metadados do Hive Metastore + metadados do Superset
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: agr-postgres
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
      # Laboratório: rede interna isolada; evita incompatibilidade de SCRAM
      # entre o driver JDBC do Hive e o PostgreSQL 15.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [lake]

  # ---------------------------------------------------------------------------
  # HDFS (NameNode + DataNode)
  # ---------------------------------------------------------------------------
  namenode:
    image: apache/hadoop:3.3.6
    container_name: agr-namenode
    hostname: namenode
    user: root
    entrypoint: ["/bin/bash", "/opt/scripts/namenode.sh"]
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./hadoop/namenode.sh:/opt/scripts/namenode.sh:ro
      - ../dados:/dados:ro
      - namenode-data:/opt/hadoop/data/name
    ports:
      - "9870:9870"   # UI + WebHDFS
      - "9000:9000"   # RPC
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfs -ls / >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [lake]

  datanode:
    image: apache/hadoop:3.3.6
    container_name: agr-datanode
    hostname: datanode
    user: root
    entrypoint: ["/bin/bash", "/opt/scripts/datanode.sh"]
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./hadoop/datanode.sh:/opt/scripts/datanode.sh:ro
      - datanode-data:/opt/hadoop/data/data
    depends_on:
      namenode:
        condition: service_healthy
    networks: [lake]

  # ---------------------------------------------------------------------------
  # Hive: schema do metastore, Metastore (9083) e HiveServer2 (10000)
  # ---------------------------------------------------------------------------
  hive-metastore-init:
    build: ./hive
    image: agr/hive:3.1.3
    container_name: agr-hive-metastore-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/hive/bin/schematool -dbType postgres -info >/dev/null 2>&1 ||
        /opt/hive/bin/schematool -dbType postgres -initSchema
    environment:
      HIVE_CONF_DIR: /opt/hive/conf
      HADOOP_CONF_DIR: /opt/hive/conf
      # Forca sockets IPv4: o kernel do container pode deixar o bind so em IPv6.
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    volumes: &hive-conf
      - ./conf/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./conf/core-site.xml:/opt/hive/conf/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hive/conf/hdfs-site.xml:ro
      - ./conf/mapred-site.xml:/opt/hive/conf/mapred-site.xml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [lake]

  hive-metastore:
    build: ./hive
    image: agr/hive:3.1.3
    container_name: agr-hive-metastore
    hostname: hive-metastore
    entrypoint: ["/opt/hive/bin/hive", "--service", "metastore"]
    environment:
      HIVE_CONF_DIR: /opt/hive/conf
      HADOOP_CONF_DIR: /opt/hive/conf
      HADOOP_HEAPSIZE: "1024"
      # Forca sockets IPv4: o kernel do container pode deixar o bind so em IPv6.
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    volumes: *hive-conf
    ports:
      - "9083:9083"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/9083'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      hive-metastore-init:
        condition: service_completed_successfully
      namenode:
        condition: service_healthy
      datanode:
        condition: service_started
    networks: [lake]

  hive-server:
    build: ./hive
    image: agr/hive:3.1.3
    container_name: agr-hive-server
    hostname: hive-server
    entrypoint: ["/opt/hive/bin/hive", "--service", "hiveserver2"]
    environment:
      HIVE_CONF_DIR: /opt/hive/conf
      HADOOP_CONF_DIR: /opt/hive/conf
      # CROSS JOINs da camada Gold estouram o default de 256 MB.
      HADOOP_HEAPSIZE: "2048"
      # Forca sockets IPv4: o kernel do container pode deixar o bind so em IPv6.
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    volumes:
      - ./conf/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./conf/core-site.xml:/opt/hive/conf/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hive/conf/hdfs-site.xml:ro
      - ./conf/mapred-site.xml:/opt/hive/conf/mapred-site.xml:ro
      - ../hive:/hive:ro
    ports:
      - "10000:10000"  # JDBC/Beeline
      - "10002:10002"  # HiveServer2 UI
    depends_on:
      hive-metastore:
        condition: service_healthy
      namenode:
        condition: service_healthy
      datanode:
        condition: service_started
    networks: [lake]

  # ---------------------------------------------------------------------------
  # Trino: consulta federada sobre o catálogo Hive
  # ---------------------------------------------------------------------------
  trino:
    image: trinodb/trino:484
    container_name: agr-trino
    hostname: trino
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./conf/core-site.xml:/etc/trino/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/etc/trino/hadoop/hdfs-site.xml:ro
    ports:
      - "8080:8080"
    depends_on:
      hive-metastore:
        condition: service_started
      namenode:
        condition: service_healthy
      datanode:
        condition: service_started
    networks: [lake]

  # ---------------------------------------------------------------------------
  # Superset: inicialização (one-shot) + aplicação web
  # ---------------------------------------------------------------------------
  superset-init:
    build: ./superset
    image: agr/superset:5.0.0
    container_name: agr-superset-init
    command: ["/bin/bash", "/app/pythonpath/superset_init.sh"]
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-dev-only-change-me}
      DATABASE_URL: postgresql+psycopg2://hive:hive@postgres:5432/superset
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@agr.local}
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/superset_init.sh:/app/pythonpath/superset_init.sh:ro
      - ./superset/bootstrap_datasets.py:/app/pythonpath/bootstrap_datasets.py:ro
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_started
    networks: [lake]

  superset:
    build: ./superset
    image: agr/superset:5.0.0
    container_name: agr-superset
    hostname: superset
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-dev-only-change-me}
      DATABASE_URL: postgresql+psycopg2://hive:hive@postgres:5432/superset
      SUPERSET_PORT: "8088"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./superset/bootstrap_datasets.py:/app/pythonpath/bootstrap_datasets.py:ro
      - ./superset/create_dashboard.py:/app/pythonpath/create_dashboard.py:ro
    ports:
      - "8088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    networks: [lake]

networks:
  lake:
    # Nome sem underscore: o Hive resolve o IP do metastore para
    # <container>.<rede> e underscores são inválidos em URI de hostname.
    name: agr-lake
    driver: bridge

volumes:
  postgres-data:
  namenode-data:
  datanode-data:
